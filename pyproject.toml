[project]
name = "vibetrip-backend"
version = "1.0.0"
description = "VibeTrip FastAPI backend"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "seed_spots.py", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes (unused imports, etc.)
    "I",      # isort — import 順序（對齊 CONVENTIONS.md）
    "UP",     # pyupgrade — 現代型別語法
    "B",      # flake8-bugbear — 常見邏輯陷阱
]
ignore = [
    "B008",   # Depends() in defaults — FastAPI 慣用寫法
]

[tool.ruff.lint.per-file-ignores]
# 長 prompt、SQL、seed 文案常超過 100 字 — 可讀性優先於強制換行
"app/services/ai_service.py" = ["E501"]
"app/services/transit_service.py" = ["E501"]
"seed_spots.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
