name: CI

on:
  push:
    branches: [main, master, develop, bee3]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check app seed_spots.py tests

      - name: Ruff format
        run: ruff format --check app seed_spots.py tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: pytest
        run: pytest -v
        env:
          DEBUG: "true"
          JWT_SECRET_KEY: pytest-ci-secret-key
