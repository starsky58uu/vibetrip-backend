name: Lint

on:
  push:
    branches: [main, master, develop, bee3]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check app seed_spots.py

      - name: Ruff format
        run: ruff format --check app seed_spots.py
